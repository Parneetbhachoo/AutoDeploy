
name: AutoDeploy CI/CD Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: AutoDeployGitHubActions

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS=$(cat <<'SCRIPT'
          set -eu
          cd /home/ubuntu/AutoDeploy

          echo "Fetching latest source code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Building candidate Docker image..."
          sudo docker build -t autodeploy:candidate .

          if sudo docker inspect autodeploy-previous >/dev/null 2>&1; then
            sudo docker rm -f autodeploy-previous
          fi

          HAD_PREVIOUS=false

          if sudo docker inspect autodeploy-container >/dev/null 2>&1; then
            sudo docker stop autodeploy-container
            sudo docker rename autodeploy-container autodeploy-previous
            HAD_PREVIOUS=true
          fi

          if ! sudo docker run -d \
            --name autodeploy-container \
            -p 80:5000 \
            --restart unless-stopped \
            autodeploy:candidate; then

            sudo docker rm -f autodeploy-container 2>/dev/null || true

            if [ "$HAD_PREVIOUS" = true ]; then
              sudo docker rename autodeploy-previous autodeploy-container
              sudo docker start autodeploy-container
            fi

            exit 1
          fi

          HEALTHY=false

          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost/health; then
              HEALTHY=true
              break
            fi
            sleep 5
          done

          if [ "$HEALTHY" = true ]; then
            echo "Deployment successful."

            if [ "$HAD_PREVIOUS" = true ]; then
              sudo docker rm -f autodeploy-previous
            fi
          else
            echo "Health check failed. Rolling back."

            sudo docker rm -f autodeploy-container 2>/dev/null || true

            if [ "$HAD_PREVIOUS" = true ]; then
              sudo docker rename autodeploy-previous autodeploy-container
              sudo docker start autodeploy-container
              curl -fsS http://localhost/health
            fi

            exit 1
          fi
          SCRIPT
          )

          PARAMS=$(jq -n --arg commands "$COMMANDS" \
            '{commands: [$commands]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1


